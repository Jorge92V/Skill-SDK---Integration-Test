name: validate-skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontmatter, nombre, links relativos y datos sensibles
        run: python3 tools/validate_skill.py .
      - name: Sintaxis de install.sh
        run: bash -n install.sh
      - name: JSON de evals
        run: python3 -c "import json; [json.load(open(p, encoding='utf-8')) for p in ('evals/prompts.json', 'evals/regresion-v0.6.json')]"
